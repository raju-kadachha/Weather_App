<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherNow</title>
    <link rel="icon" href="img/favicon.png" type="image/png" sizes="32x32" />
    <link href="./src/output.css" rel="stylesheet" />
  </head>

  <body class="overflow-x-hidden text-gray-800 bg-[#f3f4f6]">
    <!-- Header -->
    <header class="bg-white shadow-md py-4">
      <h1
        class="first-letter:text-amber-400 first-letter:font-bold text-2xl font-bold text-blue-700 text-center tracking-wide"
      >
        Weather<span
          class="first-letter:text-amber-400 first-letter:font-bold inline-block"
          >Now</span
        >
      </h1>
    </header>

    <!-- MAIN Section  -->
    <main
      class="flex flex-col justify-center sm:max-w-lg md:max-w-2xl lg:max-w-2xl mx-auto mt-6 p-4"
    >
      <!-- Search Section -->
      <section
        class="bg-white p-5 rounded-2xl shadow-md border border-gray-200 space-y-5"
      >
        <!-- Search Form -->
        <form class="flex items-end gap-3 flex-wrap">
          <!-- City Input -->
          <div class="flex flex-col gap-1 flex-1 min-w-[220px]">
            <label for="search" class="text-sm font-medium text-gray-700"
              >Search City</label
            >
            <input
              id="search"
              type="text"
              placeholder="Enter city name"
              class="border border-gray-300 p-2 bg-gray-50 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none text-sm"
            />
          </div>

          <!-- Search Button -->
          <button
            type="button"
            id="searchBtn"
            class="flex items-center gap-2 bg-blue-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition"
          >
            <span>Search</span>
            <img src="img/transparency.png" alt="Search" class="w-4 h-4" />
          </button>

          <!-- Current Location Button -->
          <button
            type="button"
            id="locationBtn"
            class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 hover:bg-green-700 transition"
          >
            <span>Location</span>
            <img class="w-4 h-4" src="img/placeholder.png" alt="Location" />
          </button>
        </form>
        <div id="recentBox" class="hidden w-full mt-4">
          <label class="text-sm text-gray-700 font-medium mb-1 block">
            Recently Searched
          </label>

          <!-- Dropdown button -->
          <button
            id="recentToggle"
            class="w-full flex items-center justify-between bg-gray-50 p-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-100"
          >
            <span>Select recent city</span>
            <span class="text-lg">⌄</span>
          </button>

          <!-- Dropdown menu -->
          <ul
            id="recentList"
            class="hidden mt-1 bg-white border border-gray-300 rounded-lg shadow-md max-h-40 overflow-y-auto text-sm"
          ></ul>
        </div>
      </section>

      <!-- Section For Todays Weather Card  -->
      <section id="todayWeather"></section>

      <!-- Section For 6 Days Weather Forecast -->
      <section>
        <h2
          id="forecastHeading"
          class="hidden mt-6 text-center mx-4 p-4 bg-white rounded-2xl shadow-lg border border-gray-300 text-xl font-bold text-gray-800"
        >
          Forecast for the Coming Days
        </h2>
        <section
          id="forecastSection"
          class="grid gap-4 mt-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"
        ></section>
      </section>
    </main>
    <script src="src/script.js"></script>
  </body>
</html>
