<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>

  <body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-md py-4">
      <h1 class="text-2xl font-bold text-blue-700 text-center tracking-wide">
        WeatherNow
      </h1>
    </header>

    <main
      class="flex flex-col justify-center align-middle max-w-xl mx-auto mt-6 p-4"
    >
      <!-- Search UI card -->
      <section
        class="bg-white p-5 rounded-2xl shadow-md border border-gray-200 space-y-5"
      >
        <!-- Search Form -->
        <form class="flex items-end gap-3 flex-wrap">
          <!-- City Input -->
          <div class="flex flex-col gap-1 flex-1 min-w-[220px]">
            <label for="search" class="text-sm font-medium text-gray-700"
              >Search City</label
            >
            <input
              id="search"
              type="text"
              placeholder="Enter city name"
              class="border border-gray-300 p-2 bg-gray-50 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none text-sm"
            />
          </div>

          <!-- Search Button -->
          <button
            type="button"
            id="searchBtn"
            class="flex items-center gap-2 bg-blue-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-600 transition"
          >
            <span>Search</span>
            <img src="img/transparency.png" alt="Search" class="w-4 h-4" />
          </button>

          <!-- Current Location Button -->
          <button
            type="button"
            id="locationBtn"
            class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 hover:bg-green-600 transition"
          >
            <span>Location</span>
            <img class="w-4 h-4" src="img/placeholder.png" alt="Location" />
          </button>
        </form>

        <!-- Recently Searched Dropdown -->
        <div class="flex flex-col gap-1">
          <label id="recentCities" class="font-medium text-sm text-gray-700"
            >Recently Searched</label
          >

          <select
            id="recentCities"
            class="border border-gray-300 p-2 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-blue-400 outline-none"
          >
            <option selected disabled>No recent cities</option>
          </select>
        </div>
      </section>

      <section id="todayWeather"></section>
    </main>
    <script src="src/script.js"></script>
  </body>
</html>
